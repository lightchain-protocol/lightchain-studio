name: Release

# Builds Lightchain Studio for every platform and publishes the packages to a
# GitHub Release. Runs when a version tag (v1.2.3) is pushed, or on demand.

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: Version to label the packages with (for example 0.1.0)
        required: true
      only:
        description: Build a single platform (macos, linux, windows) or leave empty for all
        required: false
        default: ''

env:
  NODE_OPTIONS: --max-old-space-size=8192

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - id: v
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "version=${{ github.event.inputs.version }}" >> "$GITHUB_OUTPUT"
          else
            echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          fi

  macos:
    needs: version
    if: ${{ !inputs.only || inputs.only == 'macos' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            runner: macos-14
            label: AppleSilicon
          - arch: x64
            runner: macos-15-intel
            label: Intel
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - run: npm ci
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Package DMG
        env:
          APPLE_SIGN_IDENTITY: ${{ secrets.APPLE_SIGN_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: |
          ./scripts/package-mac.sh ${{ matrix.arch }}
          mkdir -p dist
          mv ../LightchainStudio-*-${{ matrix.arch }}.dmg "dist/LightchainStudio-${{ needs.version.outputs.version }}-macOS-${{ matrix.label }}.dmg"
      - uses: actions/upload-artifact@v4
        with:
          name: darwin-${{ matrix.arch }}
          path: dist/*
          if-no-files-found: error

  linux:
    needs: version
    if: ${{ !inputs.only || inputs.only == 'linux' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - name: Free disk space (unused preinstalled toolchains)
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/.ghcup /usr/share/swift
          sudo docker image prune -af >/dev/null 2>&1 || true
          df -h / /mnt
      - name: Add swap (the minifier needs more than the runner's RAM)
        run: |
          sudo fallocate -l 8G /mnt/swapfile
          sudo chmod 600 /mnt/swapfile
          sudo mkswap /mnt/swapfile
          sudo swapon /mnt/swapfile
          free -h
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - name: Build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libx11-dev libxkbfile-dev libsecret-1-dev libkrb5-dev
      - run: npm ci
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: 1
      - name: Package tar.gz
        run: |
          npm run gulp vscode-linux-x64-min
          mkdir -p dist
          tar -C .. --transform 's|^VSCode-linux-x64|lightchain-studio|' -czf "dist/LightchainStudio-${{ needs.version.outputs.version }}-Linux-x64.tar.gz" VSCode-linux-x64
      - uses: actions/upload-artifact@v4
        with:
          name: linux-x64
          path: dist/*
          if-no-files-found: error

  windows:
    needs: version
    if: ${{ !inputs.only || inputs.only == 'windows' }}
    runs-on: windows-2022
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - run: npm ci
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Package zip and installer
        shell: pwsh
        run: |
          $v = "${{ needs.version.outputs.version }}"
          npm run gulp vscode-win32-x64-min
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          New-Item -ItemType Directory -Force dist | Out-Null
          Compress-Archive -Path "..\VSCode-win32-x64\*" -DestinationPath "dist\LightchainStudio-$v-Windows-x64-Portable.zip"
          npm run gulp vscode-win32-x64-inno-updater
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm run gulp vscode-win32-x64-user-setup
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $setup = Get-ChildItem ".build\win32-x64\user-setup" -Filter *.exe | Select-Object -First 1
          Move-Item $setup.FullName "dist\LightchainStudio-$v-Windows-x64-Setup.exe"
      - uses: actions/upload-artifact@v4
        with:
          name: win32-x64
          path: dist/*
          if-no-files-found: error

  publish:
    needs: [version, macos, linux, windows]
    if: always() && needs.version.result == 'success' && contains(needs.*.result, 'success')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: packages
          merge-multiple: true
      - name: Checksums (merged with packages already on the release)
        working-directory: packages
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event_name == 'push' && github.ref_name || format('v{0}', needs.version.outputs.version) }}
        run: |
          sha256sum * > new.sums
          # Keep checksums of assets published by earlier runs for this tag, unless we rebuilt them now.
          gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${TAG}" --jq '.assets[] | select(.name != "SHA256SUMS.txt") | "\(.digest // "")  \(.name)"' 2>/dev/null             | sed 's/^sha256://' | grep -v '^ ' > old.sums || true
          { cat new.sums; grep -v -F -f <(cut -c67- new.sums) old.sums || true; } | sort -k2 > SHA256SUMS.txt
          rm -f new.sums old.sums
          cat SHA256SUMS.txt
      - name: Release notes
        env:
          V: ${{ needs.version.outputs.version }}
          TAG: ${{ github.event_name == 'push' && github.ref_name || format('v{0}', needs.version.outputs.version) }}
        run: |
          D="https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}"
          cat > notes.md <<EOF
          ## Download

          | | Platform | Download |
          |:-:|---|---|
          | <img src="https://cdn.simpleicons.org/apple/8b949e" width="20" alt="macOS"> | **macOS** Apple Silicon (M1 and newer) | [LightchainStudio-${V}-macOS-AppleSilicon.dmg](${D}/LightchainStudio-${V}-macOS-AppleSilicon.dmg) |
          | <img src="https://cdn.simpleicons.org/apple/8b949e" width="20" alt="macOS"> | **macOS** Intel | [LightchainStudio-${V}-macOS-Intel.dmg](${D}/LightchainStudio-${V}-macOS-Intel.dmg) |
          | <img src="https://cdn.jsdelivr.net/gh/devicons/devicon/icons/windows11/windows11-original.svg" width="20" alt="Windows"> | **Windows** 10 / 11, x64 installer | [LightchainStudio-${V}-Windows-x64-Setup.exe](${D}/LightchainStudio-${V}-Windows-x64-Setup.exe) |
          | <img src="https://cdn.jsdelivr.net/gh/devicons/devicon/icons/windows11/windows11-original.svg" width="20" alt="Windows"> | **Windows** x64 portable (no install) | [LightchainStudio-${V}-Windows-x64-Portable.zip](${D}/LightchainStudio-${V}-Windows-x64-Portable.zip) |
          | <img src="https://cdn.jsdelivr.net/gh/devicons/devicon/icons/linux/linux-original.svg" width="22" alt="Linux"> | **Linux** x64 | [LightchainStudio-${V}-Linux-x64.tar.gz](${D}/LightchainStudio-${V}-Linux-x64.tar.gz) |

          Not sure which Mac you have? Apple menu → *About This Mac*: "Apple M1/M2/M3/M4" means Apple Silicon, "Intel" means Intel.

          ## Install

          **macOS.** Open the DMG and drag **Lightchain Studio** to Applications. If the build is not notarized, the first time right-click the app and choose **Open**, then **Open** again.

          **Windows.** Run the Setup installer, or unzip the portable build anywhere and start \`Lightchain Studio.exe\`. If SmartScreen appears, choose *More info* → *Run anyway*.

          **Linux.** \`tar -xzf LightchainStudio-${V}-Linux-x64.tar.gz\` then run \`lightchain-studio/lc-studio\`.

          ## Verify

          \`SHA256SUMS.txt\` lists the checksum of every file above. On macOS or Linux: \`sha256sum -c SHA256SUMS.txt --ignore-missing\`.

          ## Changes
          EOF
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event_name == 'push' && github.ref_name || format('v{0}', needs.version.outputs.version) }}
          name: Lightchain Studio ${{ needs.version.outputs.version }}
          body_path: notes.md
          generate_release_notes: true
          make_latest: true
          files: packages/*
          fail_on_unmatched_files: true
