name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libx11-dev libxkbfile-dev libsecret-1-dev libkrb5-dev

      - name: Install
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm ci

      - name: Lightchain extension (typecheck, test, bundle)
        working-directory: extensions/lightchain-studio/tools
        run: |
          npm ci --no-audit --no-fund
          npm run typecheck
          npm test
          npm run build

      - name: Bundle is up to date
        run: |
          if ! git diff --quiet --ignore-cr-at-eol -- extensions/lightchain-studio/dist/extension.js; then
            echo "::error::extensions/lightchain-studio/dist/extension.js is out of date. Run 'npm run build' in extensions/lightchain-studio/tools and commit the result."
            exit 1
          fi

      - name: Compile
        run: npm run compile
